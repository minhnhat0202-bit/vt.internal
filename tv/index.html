<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Bản tin trình chiếu TV của Trung tâm Nền tảng Công nghệ và Chuyển đổi số.">
<link rel="icon" type="image/png" href="../img/logo-vtnet.png">
<title>Bản tin TV · TT Nền tảng Công nghệ & CĐS</title>
<!-- Trang bản tin TV, độc lập với trang Giải thể thao (../index.html). Nội dung nằm trong content.js. -->
<style>
  @font-face { font-family: "FS PF BeauSans Pro"; font-weight: 600; font-display: swap; src: url("../fonts/FSPFBeauSansPro-SemiBold.ttf") format("truetype"); }
  @font-face { font-family: "FS PF BeauSans Pro"; font-weight: 700; font-display: swap; src: url("../fonts/FSPFBeauSansPro-Bold.otf") format("opentype"); }
  @font-face { font-family: "FS PF BeauSans Pro"; font-weight: 800; font-display: swap; src: url("../fonts/FSPFBeauSansPro-Black.ttf") format("truetype"); }
  @font-face { font-family: "Roboto"; font-weight: 400; font-display: swap; src: url("../fonts/Roboto-Regular.ttf") format("truetype"); }
  @font-face { font-family: "Roboto"; font-weight: 500; font-display: swap; src: url("../fonts/Roboto-Medium.ttf") format("truetype"); }
  @font-face { font-family: "Roboto"; font-weight: 700; font-display: swap; src: url("../fonts/Roboto-Bold.ttf") format("truetype"); }

  /* Neon Tech, nền tối. Chỉ 5 màu Viettel và tint của chúng. */
  :root {
    --ink: #F2F2F2; --ink-2: rgba(242,242,242,.78); --ink-3: rgba(242,242,242,.52);
    --red: #EE0033; --red-soft: #FFD9E0; --grey: #B5B4B4;
    --display: "FS PF BeauSans Pro", "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
    --body: "Roboto", "Segoe UI", Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; overflow: hidden; background: #000; color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; cursor: none; }
  .stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%) scale(var(--k, .5)); transform-origin: center; overflow: hidden;
    background: radial-gradient(900px 700px at 8% 12%, rgba(238,0,51,.5), transparent 60%), radial-gradient(800px 600px at 96% 92%, rgba(238,0,51,.28), transparent 60%), linear-gradient(135deg, #0c0b0f 0%, #17161b 55%, #0a090c 100%); }

  /* header */
  .hdr { position: absolute; left: 0; top: 0; right: 0; height: 100px; display: flex; align-items: center; justify-content: space-between; padding: 0 64px; border-bottom: 1.5px solid rgba(255,255,255,.14); background: linear-gradient(180deg, rgba(0,0,0,.5), rgba(0,0,0,0)); z-index: 2; }
  .hdr .org { font-family: var(--display); font-weight: 700; font-size: 32px; text-transform: uppercase; color: var(--ink-2); letter-spacing: .02em; }
  .hdr .c { display: flex; align-items: center; font-variant-numeric: tabular-nums; }
  .hdr .c .d { font-size: 30px; color: var(--ink-2); text-align: right; line-height: 1.2; }
  .hdr .c .t { font-family: var(--display); font-weight: 800; font-size: 60px; letter-spacing: -1px; }

  .glass { position: relative; background: rgba(255,255,255,.09); border: 1.5px solid rgba(255,255,255,.28); border-radius: 30px; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 28px 70px rgba(0,0,0,.45); }
  .glass::before { content: ""; position: absolute; left: 28px; right: 28px; top: 0; height: 1.5px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.85), transparent); }

  /* bố cục: Tin tiêu điểm bên trái, 3 khung bên phải */
  .dash { position: absolute; left: 0; right: 0; top: 100px; bottom: 116px; padding: 36px 64px 28px; display: grid; grid-template-columns: minmax(0, 1fr) 470px; grid-gap: 32px; gap: 32px; }
  .panel { position: relative; padding: 44px 26px 14px; min-height: 0; display: flex; flex-direction: column; }
  .panel .pg { position: absolute; right: 22px; top: 12px; font-size: 22px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .panel .lbl { position: absolute; left: 26px; top: -24px; padding: 9px 22px; background: var(--red); color: #fff; font-family: var(--display); font-weight: 700; font-size: 26px; letter-spacing: .1em; text-transform: uppercase; border-radius: 8px; box-shadow: 0 0 24px rgba(238,0,51,.55); white-space: nowrap; }
  .feature { padding: 62px 28px 22px; }
  .feature > .lbl { top: -24px; }
  /* thanh tab: 1 ô / nhóm tin (news/config.js GROUPS), cùng hàng với nhãn Tin tiêu điểm, các ô chia đều bề ngang */
  .feature .tabs { position: absolute; left: 330px; right: 28px; top: 10px; overflow: hidden; z-index: 2; }
  .feature .tabs .track { display: flex; gap: 14px; transition: transform .6s ease; will-change: transform; align-items: stretch; }
  .feature .tab { flex: 1 1 0; min-width: 0; font-size: 21px; font-weight: 500; color: var(--grey); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; }
  /* mỗi tab là một nhóm tin; vạch dưới tab chia đoạn, mỗi đoạn một tin */
  .feature .tab i { display: flex; gap: 4px; height: 5px; margin-top: 9px; }
  .feature .tab s { flex: 1 1 0; border-radius: 3px; background: rgba(255,255,255,.18); overflow: hidden; }
  .feature .tab s b { display: block; height: 100%; width: 0; background: #e3122b; }
  .feature .tab.on { color: #fff; }
  .feature .tab s.done b { width: 100%; background: rgba(255,255,255,.55); }
  /* dòng tiêu đề: tiêu đề in hoa, nhãn (tuỳ chọn), dòng phụ */
  .feature .headline { margin: 11px 0 14px; display: flex; align-items: baseline; justify-content: flex-start; flex-wrap: wrap; column-gap: 20px; row-gap: 4px; font-family: var(--display); font-weight: 800; font-size: 36px; line-height: 1.15; text-transform: uppercase; letter-spacing: .01em; text-shadow: 0 0 24px rgba(238,0,51,.45); }
  .feature .headline .tag { font-size: 18px; font-weight: 700; letter-spacing: .12em; color: #1a1204; background: #f2c14e; border-radius: 6px; padding: 8px 12px; align-self: center; text-shadow: none; line-height: 1; }
  .fade { animation: fd .7s ease both; }
  @keyframes fd { from { opacity: 0; transform: translateY(10px); } }
  .media { position: relative; flex: 1; min-height: 0; border-radius: 20px; overflow: hidden; background: #000; }
  .media .bg { position: absolute; top: -30px; right: -30px; bottom: -30px; left: -30px; background-position: center; background-size: cover; filter: blur(18px) brightness(.5); opacity: 0; transition: opacity .8s; }
  .media .bg.on { opacity: 1; }
  .media img.pic, .media video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: contain; opacity: 0; transition: opacity .8s; }
  .media img.pic.on, .media video.on { opacity: 1; }
  .media canvas.fx { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; opacity: 0; transition: opacity .6s; }
  .media canvas.fx.on { opacity: 1; }
  .media .count:empty { display: none; }
  .media .count { position: absolute; right: 20px; bottom: 16px; padding: 8px 16px; border-radius: 999px; background: rgba(0,0,0,.6); font-size: 24px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .media .empty-media { position: absolute; top: 50%; left: 0; right: 0; transform: translateY(-50%); text-align: center; font-size: 30px; color: var(--ink-3); padding: 0 40px; }
  /* bên phải: Hôm nay (cao hơn, trống thì chạy châm ngôn), Sắp diễn ra */
  .side { display: grid; grid-template-rows: minmax(0, 1.4fr) minmax(0, 1fr); grid-gap: 30px; gap: 30px; min-height: 0; }
  .panel ul { list-style: none; margin: 0; padding: 0; display: block; overflow: hidden; flex: 1; min-height: 0; }
  .panel li { position: relative; padding: 6px 0 6px 30px; font-size: 26px; line-height: 1.3; border-bottom: 1px solid rgba(255,255,255,.08); }
  .panel li:last-child, .panel li.end { border-bottom: 0; }
  .panel li::before { content: ""; position: absolute; left: 4px; top: 17px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); }
  .panel li b { font-weight: 700; }
  .panel li small { display: block; font-size: 21px; color: var(--ink-3); }
  .panel li.muted::before { background: var(--grey); box-shadow: none; }
  .panel .none { font-size: 26px; color: var(--ink-3); padding: 10px 0; }

  /* Châm ngôn: hiện trong khung Hôm nay khi hôm nay không có lịch */
  .quote { height: 100%; display: flex; flex-direction: column; justify-content: center; padding: 0 6px; }
  .quote .qm { font-family: var(--display); font-weight: 800; font-size: 110px; line-height: .6; color: var(--red); text-shadow: 0 0 24px rgba(238,0,51,.55); height: 50px; }
  .quote p { margin: 0; font-size: 33px; line-height: 1.38; font-weight: 500; color: #fff; }
  .quote small { display: block; margin-top: 18px; font-size: 22px; color: var(--ink-3); }
  .quote small:before { content: "— "; }


  /* ticker */
  .ticker { position: absolute; left: 0; right: 0; bottom: 0; height: 116px; display: flex; background: rgba(10,9,12,.88); border-top: 1.5px solid rgba(255,255,255,.16); backdrop-filter: blur(20px); z-index: 2; }
  .ticker .tag { flex: 0 0 auto; display: flex; align-items: center; padding: 0 60px 0 40px; position: relative; z-index: 0; font-family: var(--display); font-weight: 700; font-size: 34px; letter-spacing: .1em; text-transform: uppercase; }
  /* Vát cạnh phải bằng nền nghiêng thay cho clip-path có calc(): trình duyệt TV đời cũ bỏ qua cả clip-path nên nhãn thành hình chữ nhật. 17.24deg = atan(36/116) */
  .ticker .tag::before { content: ""; position: absolute; top: 0; bottom: 0; left: -60px; right: 0; z-index: -1; background: var(--red); -webkit-transform-origin: 100% 0; transform-origin: 100% 0; -webkit-transform: skewX(-17.24deg); transform: skewX(-17.24deg); }
  .ticker .run { flex: 1; overflow: hidden; display: flex; align-items: center; font-size: 40px; position: relative; }
  .ticker .run { -webkit-mask-image: linear-gradient(90deg, transparent, #000 70px, #000 calc(100% - 50px), transparent); mask-image: linear-gradient(90deg, transparent, #000 70px, #000 calc(100% - 50px), transparent); }
  .ticker .run div { white-space: nowrap; display: flex; padding-left: 16px; animation: run 48s linear infinite; }
  /* Mã QR gửi tin: đầu phải dòng chạy, vát cạnh trái đối xứng với nhãn Đừng bỏ lỡ */
  .ticker .qr { flex: 0 0 auto; display: flex; align-items: center; padding: 0 40px 0 58px; background: linear-gradient(90deg, #2a1218, #44494D); -webkit-clip-path: polygon(36px 0, 100% 0, 100% 100%, 0 100%); clip-path: polygon(36px 0, 100% 0, 100% 100%, 0 100%); }
  .ticker .qr div { text-align: right; font-size: 21px; line-height: 1.4; color: var(--ink-2); }
  .ticker .qr div b { display: block; margin-bottom: 8px; font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.2; letter-spacing: .06em; text-transform: uppercase; color: #fff; }
  .ticker .qr img { flex: none; width: 96px; height: 96px; margin-left: 26px; padding: 5px; background: #fff; border-radius: 8px; box-sizing: border-box; }
  .ticker .run i { font-style: normal; color: var(--red); margin-right: 28px; }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  /* tương thích trình duyệt TV cũ: khoảng cách flex bằng margin thay cho gap */
  .hdr .c > * + * { margin-left: 28px; }
  .ticker .run div > * + * { margin-left: 120px; }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } .ticker .run div { animation: none; } .feature .tabs .track { transition: none; } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <header class="hdr">
    <span class="org">Bản tin · Trung tâm Nền tảng Công nghệ &amp; Chuyển đổi số</span>
    <div class="c"><div class="d" id="tv-date"></div><div class="t" id="tv-time"></div></div>
  </header>

  <section class="dash">
    <div class="glass panel feature">
      <span class="lbl">Tin tiêu điểm</span>
      <div class="tabs" id="tabs"></div>
      <h2 class="headline" id="dash-headline"></h2>
      <div class="media" id="media"><div class="bg" id="media-bg"></div><img class="pic" id="media-a" alt=""><img class="pic" id="media-b" alt=""><canvas class="fx" id="media-fx" width="1920" height="1080"></canvas><div class="count" id="media-count"></div></div>
    </div>
    <div class="side">
      <div class="glass panel"><span class="lbl">Hôm nay</span><span class="pg"></span><ul id="p-today" data-empty="Hôm nay chưa có lịch."></ul></div>
      <div class="glass panel"><span class="lbl">Sắp diễn ra</span><span class="pg"></span><ul id="p-next" data-empty="Không còn lịch sắp tới."></ul></div>
    </div>
  </section>

  <footer class="ticker"><div class="tag">Đừng bỏ lỡ</div><div class="run"><div id="tv-run"></div></div><div class="qr"><div><b>Phòng bạn có tin hay?</b>Quét mã gửi tin lên Bản tin TV</div><img src="../img/qr-gui-tin.svg" alt=""></div></footer>
</div>

<div id="backdrop" style="display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:50;background:#000"></div>
<div id="err" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;background:#B30026;color:#fff;font:14px/1.4 Roboto,Arial,sans-serif;padding:10px 16px;word-break:break-word"></div>
<script>
window.onerror = function (msg, src, line) { var e = document.getElementById('err'); if (!e) return; e.style.display = 'block'; e.textContent = 'Lỗi trang: ' + msg + (line ? ' (dòng ' + line + ')' : '') + ' · Trình duyệt: ' + navigator.userAgent; };
if (location.hash === '#ua') { document.addEventListener('DOMContentLoaded', function () { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent = 'Trình duyệt: ' + navigator.userAgent + ' · ' + window.innerWidth + '×' + window.innerHeight; }); }
</script>
<script src="../media.js"></script>
<script src="content.js"></script>
<script src="../news/config.js"></script>
<script src="../news/shared.js"></script>
<script>
// Chạy sau khi ghép tin các phòng đã duyệt (news/, Apps Script) vào window.TV. ?preview=1 = khung xem trước của trang gửi tin, trang duyệt.
function bootTV(PREVIEW) {
  'use strict';
  const C = window.TV || {};
  const STORY_SECONDS = C.STORY_SECONDS || 60;
  const VIDEO_MAX_SECONDS = C.VIDEO_MAX_SECONDS || 90;
  // Nguồn ảnh Drive: media.js / media.json ở gốc repo, GitHub Action cập nhật mỗi 15 phút.
  // MEDIA_API_URL (tuỳ chọn, xem apps-script/media.gs) cho cập nhật nhanh hơn.
  const DRIVE_FOLDER_ID = '18QdoAzINpvlfo54nMBTAGTn9avTo214E';   // thư mục Drive công khai; tools/drive-media.py đọc hằng này
  const MEDIA_API_URL = '';
  const MEDIA_REFRESH_SECONDS = 300;
  // Tự cập nhật: thấy index.html hoặc content.js trên máy chủ khác bản đang chạy thì tự F5; mỗi ngày tải lại lúc dailyAt.
  const AUTO_RELOAD = { checkSeconds: 120, dailyAt: '05:00', files: ['index.html', 'content.js'] };

  const ROOT = '../';
  const R = (p) => (!p || /^(https?:|data:|blob:|\/|\.\.?\/)/.test(p) ? p : ROOT + p);   // đường dẫn tính từ gốc repo
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const p2 = (n) => (n < 10 ? '0' : '') + n;
  const DAYS = ['Chủ nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];
  const vnDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
  const todayKey = () => { const d = new Date(); return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()); };
  const fmtD = (iso) => iso.slice(8, 10) + '/' + iso.slice(5, 7);
  const fmtRange = (it) => it.to ? fmtD(it.from) + ' đến ' + fmtD(it.to) : fmtD(it.from);
  const dayName = (iso) => DAYS[vnDate(iso).getDay()];
  function daysLeft(date) { const now = new Date(); const a = new Date(now.getFullYear(), now.getMonth(), now.getDate()); const b = new Date(date.getFullYear(), date.getMonth(), date.getDate()); return Math.max(0, Math.round((b - a) / 86400000)); }
  const alive = (x) => !x.until || x.until >= todayKey();
  const inRange = (x) => { const t = todayKey(); return (!x.from || x.from <= t) && (!x.to || x.to >= t); };

  // Tin còn hạn (until), lọc lúc mở trang; trang tự tải lại mỗi sáng nên tin hết hạn tự rơi ra.
  // Tin phòng ban thường (news/, DEPT_NEWS) chiếu nối cuối Tin tiêu điểm vì không còn khung Tin các phòng
  // Ảnh trong slides cũng có thể khai until riêng: hết hạn thì ảnh đó tự ẩn, tin vẫn chạy các ảnh còn lại
  // Tab = nhóm tin (news/config.js GROUPS, theo trường tab của tin); tin xếp theo thứ tự nhóm, trong nhóm giữ thứ tự gốc
  const GROUPS = ((window.VTNEWS_CONFIG || {}).GROUPS || []).map((g) => g.name);
  const groupOf = (st) => { const k = GROUPS.indexOf(st.tab); return k < 0 ? GROUPS.length - 1 : k; };
  const STORIES = (C.STORIES || []).concat(C.DEPT_NEWS || []).filter(alive)
    .map((st) => (st.slides ? Object.assign({}, st, { slides: st.slides.filter(alive) }) : st))
    .filter((st) => !st.slides || st.slides.length)
    .map((st, k) => ({ st, k, g: groupOf(st) })).sort((a, b) => a.g - b.g || a.k - b.k).map((x) => Object.assign({}, x.st, { group: x.g }));
  const AGENDA = (C.AGENDA || []).slice().sort((a, b) => a.from.localeCompare(b.from));
  const status = (it) => { const t = todayKey(); const end = it.to || it.from; return end < t ? 'done' : it.from <= t ? 'now' : 'next'; };

  // ---------- khung lịch bên phải: chia trang theo chiều cao thật của khung, mỗi trang 7 giây ----------
  let dashLists = {}, dashPage = 0;
  function paintPanels() {
    Object.keys(dashLists).forEach((id) => {
      const items = dashLists[id], el = $(id), pgEl = el.parentNode.querySelector('.pg');
      if (!items.length && id === 'p-today' && quoteList().length) { pgEl.textContent = ''; showQuote(el); return; }
      if (!items.length) { el.innerHTML = '<div class="none">' + esc(el.getAttribute('data-empty')) + '</div>'; pgEl.textContent = ''; return; }
      el.innerHTML = items.join('');
      const lis = Array.from(el.children), H = el.clientHeight, pages = [[]];
      let top = lis[0].offsetTop;
      lis.forEach((x) => { const cur = pages[pages.length - 1]; if (cur.length && x.offsetTop + x.offsetHeight - top > H) { pages.push([x]); top = x.offsetTop; } else cur.push(x); });
      const show = pages[dashPage % pages.length];
      lis.forEach((x) => { x.style.display = show.indexOf(x) > -1 ? '' : 'none'; x.classList.toggle('end', x === show[show.length - 1]); });
      pgEl.textContent = pages.length > 1 ? (dashPage % pages.length + 1) + '/' + pages.length : '';
    });
  }
  function li(t, sub, cls) { return `<li${cls ? ' class="' + cls + '"' : ''}><b>${esc(t)}</b>${sub ? `<small>${esc(sub)}</small>` : ''}</li>`; }
  const meta = (x, extra) => [x.time, extra, x.place].filter(Boolean).join(' · ');
  function renderDash() {
    const t = todayKey();
    // Hôm nay: mục thêm tay + sự kiện một ngày hôm nay + các giai đoạn (có to) đang diễn ra
    dashLists['p-today'] = (C.TODAY || []).filter(inRange).map((x) => li(x.t || x.title, x.s || x.sub))
      .concat(AGENDA.filter((x) => status(x) === 'now' && !x.to).map((x) => li(x.title, meta(x, dayName(x.from) + ' ' + fmtD(x.from)))))
      .concat(AGENDA.filter((x) => x.to && status(x) === 'now').map((x) => li(x.title, meta(x, fmtRange(x) +
        (x.from === t ? ' · bắt đầu hôm nay' : daysLeft(vnDate(x.to)) ? ' · còn ' + daysLeft(vnDate(x.to)) + ' ngày' : ' · kết thúc hôm nay')))));
    // Sắp diễn ra: 4 mục gần nhất chưa tới
    dashLists['p-next'] = AGENDA.filter((x) => status(x) === 'next').slice(0, 4).map((x) => li(x.title, meta(x, fmtRange(x) + ' · còn ' + daysLeft(vnDate(x.from)) + ' ngày')));
    paintPanels();
  }

  // ---------- Châm ngôn: content.js QUOTES, hoặc Google Sheet công khai (QUOTES_SHEET, CSV 3 cột: Ngày hoặc STT | Câu | Tác giả) ----------
  //   Chọn ngẫu nhiên, mỗi QUOTE_SECONDS giây đổi câu, không lặp tới khi chạy hết lượt. Dòng có ngày đúng hôm nay thì chỉ chạy các dòng đó.
  const QUOTE_SECONDS = C.QUOTE_SECONDS || 60;
  let quotes = (C.QUOTES || []).map((q) => (typeof q === 'string' ? { text: q } : q));
  function parseCSV(t) {

  const isoDay = (v) => { v = (v || '').trim(); let m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v); if (m) return m[3] + '-' + p2(+m[2]) + '-' + p2(+m[1]); m = /^(\d{4})-(\d{2})-(\d{2})/.exec(v); return m ? m[0] : ''; };
  function loadQuotes() {
    if (!C.QUOTES_SHEET || location.protocol === 'file:') return;
    fetch(C.QUOTES_SHEET + (C.QUOTES_SHEET.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).then((t) => {
      const rows = parseCSV(t || '').filter((r) => r.length > 1 && (r[1] || '').trim());

      if (rows.length) { quotes = rows.map((r) => ({ day: isoDay(r[0]), text: r[1].trim(), by: (r[2] || '').trim() })); quoteShown = ''; paintPanels(); }
    }).catch(() => {});
  }
  function quoteList() {

  let quoteShown = '', quoteSlot = -1, quoteBag = [];
  function showQuote(el) {

    if (slot !== quoteSlot || !quoteShown) {                          // sang lượt mới: rút ngẫu nhiên một câu chưa chiếu
      quoteSlot = slot;
      const keys = list.map((x) => x.text + '|' + x.by);

      if (!quoteBag.length) quoteBag = keys.filter((k) => k !== quoteShown || keys.length === 1);
      quoteShown = quoteBag.splice(Math.floor(Math.random() * quoteBag.length), 1)[0];
    }
    const q = list[list.map((x) => x.text + '|' + x.by).indexOf(quoteShown)] || list[0];
    el.innerHTML = `<div class="quote"><span class="qm">“</span><p>${esc(q.text)}</p>${q.by ? `<small>${esc(q.by)}</small>` : ''}</div>`;
    fadeIn(el);
  }

  // ---------- dòng chạy ----------
  function renderTicker() {
    const msgs = [];
    AGENDA.filter((x) => status(x) === 'now' && !x.to).forEach((x) => msgs.push('Hôm nay: ' + x.title + (x.time ? ' · ' + x.time : '') + (x.place ? ' · ' + x.place : '')));
    AGENDA.filter((x) => status(x) === 'next').slice(0, 3).forEach((x) => msgs.push(fmtD(x.from) + ': ' + x.title + (x.time ? ' · ' + x.time : '')));
    STORIES.forEach((st) => { [].concat(st.ticker || []).forEach((m) => msgs.push(m)); });
    (C.TICKER || []).forEach((m) => { if (typeof m === 'string') msgs.push(m); else if (alive(m)) msgs.push(m.text); });
    const h = msgs.map((m) => `<span><i>▶</i>${esc(m)}</span>`).join('');
    $('tv-run').innerHTML = h + h;
  }

  // ---------- ảnh và video từ Google Drive ----------
  let media = [], mIdx = -1, mTimer = null, mFront = 'a', mediaOn = false, curVideo = null, bag = [];
  const driveStory = () => STORIES.find((st) => st.source === 'drive') || {};
  const hasIntro = () => !!(driveStory().intro && driveStory().intro.image);
  // Ảnh kế tiếp: tuần tự, hoặc rút ngẫu nhiên từ "túi" các ảnh chưa chiếu (hết túi thì đổ lại) khi bật shuffle
  function pickNext() {
    if (!driveStory().shuffle) return (mIdx + 1) % media.length;
    if (!bag.length) { bag = media.map((_, k) => k); for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = bag[i]; bag[i] = bag[j]; bag[j] = t; } }
    let k = bag.pop(); if (k === mIdx && bag.length) { const k2 = bag.pop(); bag.push(k); k = k2; }
    return k;
  }
  const shownCount = () => (driveStory().shuffle ? media.length - bag.length : mIdx + 1);
  const imgUrl = (id, w) => 'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + (w || 1600);
  const vidUrl = (m) => (m.src ? R(m.src) : 'https://drive.google.com/uc?export=download&id=' + m.id);
  // pháo hoa hạt trên thẻ mở đầu (canvas 1920×1080)
  let fxOn = false, fxParts = [], fxLast = 0, fxNext = 0, fxRaf = null;
  const fxCtx = $('media-fx').getContext('2d');
  function fxBurst() {
    const x = Math.random() < .5 ? 80 + Math.random() * 280 : 1560 + Math.random() * 280, y = 80 + Math.random() * 420;
    for (let i = 0; i < 65; i++) { const a = Math.random() * Math.PI * 2, v = 35 + Math.random() * 150;
      fxParts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 1.5 + Math.random(), color: Math.random() < .3 ? '255,65,85' : '255,180,210' }); }
  }
  function fxFrame(t) {

    fxCtx.clearRect(0, 0, 1920, 1080);

    fxParts = fxParts.filter((p) => p.t < p.life);
    for (let i = 0; i < fxParts.length; i++) { const p = fxParts[i]; p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 32 * dt;
      fxCtx.beginPath(); fxCtx.fillStyle = 'rgba(' + p.color + ',' + Math.max(0, 1 - p.t / p.life) + ')'; fxCtx.shadowColor = 'rgb(' + p.color + ')'; fxCtx.shadowBlur = 12; fxCtx.arc(p.x, p.y, 1.7, 0, 7); fxCtx.fill(); }

  function fxStart() { if (fxOn) return; fxOn = true; fxParts = []; fxLast = performance.now(); fxNext = 0; $('media-fx').classList.add('on'); fxRaf = requestAnimationFrame(fxFrame); }
  function fxStop() { fxOn = false; if (fxRaf) cancelAnimationFrame(fxRaf); $('media-fx').classList.remove('on'); fxCtx.clearRect(0, 0, 1920, 1080); }
  function swapTo(src) {
    const show = mFront === 'a' ? $('media-b') : $('media-a'), hide = mFront === 'a' ? $('media-a') : $('media-b');
    show.src = src; show.classList.add('on'); hide.classList.remove('on'); mFront = mFront === 'a' ? 'b' : 'a';
  }
  function showIntro() {
    stopVideo(); $('media-count').textContent = '';
    const src = R(driveStory().intro.image), secs = driveStory().intro.seconds || 12;
    const bg = $('media-bg'); bg.style.backgroundImage = 'url("' + src + '")'; bg.classList.add('on');
    const pre = new Image(); let done = false;
    const fin = () => { if (done || !mediaOn) return; done = true; swapTo(src); fxStart();
      mTimer = setTimeout(() => { fxStop(); nextMedia(); }, secs * 1000); };
    pre.onload = fin; pre.onerror = () => { done = true; nextMedia(); }; pre.src = src; setTimeout(fin, 6000);
  }
  function setMedia(list) {
    const fresh = (list || []).filter((m) => m && m.id && (m.type === 'image' || m.type === 'video'));
    const mi = mIdx; const curId = mi >= 0 && media[mi] ? media[mi].id : null;
    if (fresh.map((m) => m.id).join(',') === media.map((m) => m.id).join(',')) return; // không đổi
    media = fresh; bag = [];
    if (curId) { const k = media.findIndex((m) => m.id === curId); const ni = k >= 0 ? k : Math.min(mi, media.length - 1); mIdx = ni; if (mediaOn && ni >= 0) $('media-count').textContent = shownCount() + ' / ' + media.length; }
  }

    }
    if (location.protocol === 'file:') return;
    fetch(ROOT + 'media.json?v=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).then((j) => { if (j && j.length !== undefined) setMedia(j); }).catch(() => {});
  }
  function stopVideo() { if (curVideo) { try { curVideo.pause(); } catch (e) {} curVideo.remove(); curVideo = null; } }
  const VBLOB = {};   // src → blob URL của video đã tải xong
  function playVideo(src, maxSeconds, onDone) {

    const a = $('media-a'), b = $('media-b'); a.classList.remove('on'); b.classList.remove('on'); stopVideo();

      if (!mediaOn) return;

      else mTimer = setTimeout(nextMedia, 1500); };

  // Dừng slideshow Drive nhưng giữ vị trí (mIdx) để lượt sau chiếu tiếp từ ảnh kế

  // ---------- Tin tiêu điểm xoay vòng ----------
  let sIdx = -1, storyT0 = 0, storyRaf = null, run = 0;
  const preloaded = [];
  function preloadStills() {
    STORIES.forEach((st) => {
      [].concat(st.image || [], (st.slides || []).map((s) => s.src), (st.items || []).filter((it) => it.type === 'image').map((it) => it.src))
        .forEach((u) => { const im = new Image(); im.src = R(u); preloaded.push(im); });
      (st.items || []).filter((it) => it.type === 'video').forEach((it) => {
        const u = R(it.src); if (VBLOB[u] || location.protocol === 'file:') return;
        fetch(u).then((r) => (r.ok ? r.blob() : null)).then((b) => { if (b) VBLOB[u] = URL.createObjectURL(b); }).catch(() => {});
      });
    });
  }
  function renderTabs() {
    const box = $('tabs');
    let track = box.querySelector('.track');
    if (!track) { track = document.createElement('div'); track.className = 'track'; box.appendChild(track); }
    const gs = [];
    STORIES.forEach((st, j) => { const last = gs[gs.length - 1]; if (last && last.g === st.group) last.js.push(j); else gs.push({ g: st.group, js: [j] }); });
    const cur = STORIES[sIdx].group;
    track.innerHTML = gs.map((x) => `<div class="tab${x.g === cur ? ' on' : ''}">${esc(GROUPS[x.g] || '')}<i>${x.js.map((j) =>
      `<s class="${j < sIdx ? 'done' : ''}"><b${j === sIdx ? ' id="pb"' : ''}></b></s>`).join('')}</i></div>`).join('');
    // kéo tab đang chiếu vào vùng nhìn khi tab tràn

    const W = box.clientWidth, over = track.scrollWidth - W;
    const dx = over > 0 ? Math.max(0, Math.min(on.offsetLeft - W * 0.4, over)) : 0;
    track.style.transform = 'translateX(' + (-dx) + 'px)';
  }
  // Tiêu đề căn trái, thẳng mép ảnh; dòng phụ (sub) không còn hiện trên TV
  function renderHead(st) {
    $('dash-headline').innerHTML = `<span>${esc(st.title)}</span>${st.tag ? `<span class="tag">${esc(st.tag)}</span>` : ''}`;
  }
  function fadeIn(el) { el.classList.remove('fade'); void el.offsetWidth; el.classList.add('fade'); }
  function showStill(src) {

    const bg = $('media-bg'); bg.style.backgroundImage = 'url("' + src + '")'; bg.classList.add('on');

  }
  // Nhiều ảnh lần lượt, có bộ đếm

  }

    if (it.type === 'video') { pauseMedia(); $('media-count').textContent = ''; $('media-bg').classList.remove('on'); playVideo(R(it.src), it.seconds || VIDEO_MAX_SECONDS, () => showItems(st, k + 1, r)); return; }
    showStill(R(it.src));

  }
  function storyMs(st) {
    if (st.seconds) return st.seconds * 1000;

    return STORY_SECONDS * 1000;
  }
  function showStory(i) {
    if (!STORIES.length) return;
    sIdx = ((i % STORIES.length) + STORIES.length) % STORIES.length; storyT0 = performance.now();
    const st = STORIES[sIdx], r = ++run;
    pauseMedia(); clearTimeout(mTimer);
    renderTabs(); renderHead(st); fadeIn($('dash-headline')); fadeIn($('media'));

    else showStill(R(st.image || ''));
  }
  function storyLoop(now) {
    const p = Math.min(1, (now - storyT0) / storyMs(STORIES[sIdx]));
    const pb = $('pb'); if (pb) pb.style.width = (p * 100) + '%';
    if (p >= 1) showStory(sIdx + 1);
    storyRaf = requestAnimationFrame(storyLoop);
  }

  // ---------- khung, đồng hồ, phím ----------
  function fit() { const k = Math.min(innerWidth / 1920, innerHeight / 1080); $('stage').style.setProperty('--k', k.toFixed(5)); }
  function clock() {
    const d = new Date();
    $('tv-date').innerHTML = DAYS[d.getDay()] + '<br>' + p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear();
    $('tv-time').textContent = p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  addEventListener('resize', fit);
  addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') showStory(sIdx + 1);
    if (e.key === 'ArrowLeft') showStory(sIdx - 1);
    if (e.key === ' ' && mediaOn) { e.preventDefault(); nextMedia(); }
    if (e.key === 'f' || e.key === 'Enter') { try { const fs = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); if (fs && fs.catch) fs.catch(() => {}); } catch (x) {} }
  });

  // ---------- tự tải lại khi có bản mới ----------
  function hashStr(t) { let h = 5381; for (let k = 0; k < t.length; k++) h = ((h << 5) + h + t.charCodeAt(k)) | 0; return h + ':' + t.length; }
  function fetchAll() {
    return Promise.all(AUTO_RELOAD.files.map((f) => fetch(f + '?v=' + Date.now(), { cache: 'no-store' }).then((r) => (r.ok ? r.text() : '')).catch(() => '')))
      .then((texts) => texts.map(hashStr).join('|'));
  }
  if (location.protocol !== 'file:' && !PREVIEW) {
    if (window.VTNews) VTNews.watch(60);   // tin phòng ban đổi (duyệt, gỡ, sửa) thì tải lại; kiểm tra mỗi 60 giây
    let baseline = '';
    fetchAll().then((h) => { baseline = h; });
    setInterval(() => { fetchAll().then((h) => { if (baseline && h !== baseline && h.indexOf('5381:0') < 0) location.reload(); }); }, Math.max(30, AUTO_RELOAD.checkSeconds) * 1000);
  }
  let lastDaily = '';
  setInterval(() => {
    if (!AUTO_RELOAD.dailyAt) return;
    const d = new Date(), hm = p2(d.getHours()) + ':' + p2(d.getMinutes()), key = todayKey() + ' ' + hm;
    if (hm === AUTO_RELOAD.dailyAt && lastDaily !== key) { lastDaily = key; location.reload(); }

  // ---------- boot ----------
  fit(); clock(); setInterval(clock, 15000);
  setMedia(window.DRIVE_MEDIA || []); refreshMedia(); setInterval(refreshMedia, Math.max(60, MEDIA_REFRESH_SECONDS) * 1000);

  setInterval(() => { dashPage++; paintPanels(); }, 7000);
  setInterval(() => { renderDash(); renderTicker(); }, 10 * 60000);   // sang ngày mới thì đổi trạng thái lịch

}
// Backdrop sự kiện (content.js BACKDROP): ảnh phủ kín màn hình trong khung giờ from đến until, hết giờ tự ẩn.
// src là một ảnh hoặc mảng ảnh; nhiều ảnh thì chuyển mờ dần, mỗi ảnh seconds giây (mặc định 7).
(function () {
  var B = (window.TV || {}).BACKDROP; if (!B || !B.src || /[?&]preview\b/.test(location.search)) return;
  var box = document.getElementById('backdrop'), list = [].concat(B.src), cur = 0;
  var t = function (s) { return s ? new Date(s.length <= 16 ? s + ':00+07:00' : s).getTime() : NaN; };
  var a = t(B.from), b = t(B.until);
  var imgs = list.map(function (src, i) {
    var img = document.createElement('img'); img.alt = '';
    img.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;transition:opacity 1s ease;opacity:' + (i ? 0 : 1);

  if (imgs.length > 1) setInterval(function () {
    imgs[cur].style.opacity = 0; cur = (cur + 1) % imgs.length; imgs[cur].style.opacity = 1;
  }, (+B.seconds || 7) * 1000);
  function tick() { var n = Date.now(); box.style.display = (!(n < a) && !(n > b)) ? 'block' : 'none'; }
  tick(); setInterval(tick, 15000);
})();
(function () {
  const PREVIEW = /[?&]preview\b/.test(location.search);
  let booted = false; const go = () => { if (!booted) { booted = true; bootTV(PREVIEW); } };
  if (window.VTNews) VTNews.loadForTV(window.TV = window.TV || {}, PREVIEW).then(go, go); else go();
})();
