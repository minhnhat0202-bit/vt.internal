# Phát trang tĩnh từ /site (bản sao repo do sync.sh cập nhật).
# Gắn vào /etc/nginx/conf.d/default.conf của image nginx.
server {
    listen 80;
    server_name _;
    root /site;
    index index.html;
    charset utf-8;

    # Chuyển hướng /tv -> /tv/ bằng đường dẫn tương đối, để không mất cổng khi map 8080:80.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Giống GitHub Pages: trình duyệt giữ bản cũ tối đa 10 phút.
    add_header Cache-Control "max-age=600";

    # Không phát .git, .github, .gitignore.
    location ~ /\. { return 404; }

    location / { try_files $uri $uri/ =404; }
}
