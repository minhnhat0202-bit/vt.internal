# Bản tin TV trên Kubernetes: 1 pod, 2 container (sync kéo repo, web là nginx), chung một emptyDir.
# Trước khi apply, trong thư mục lab/:
#   kubectl create configmap cloud-tv-conf --from-file=nginx.conf --from-file=sync.sh
#   sửa REPO_URL bên dưới thành địa chỉ repo trên Gogs
#   kubectl apply -f k8s.yaml
# Trang TV: http://<IP node>:30080/tv/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-tv
  labels:
    app: cloud-tv
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-tv
  template:
    metadata:
      labels:
        app: cloud-tv
    spec:
      containers:
        - name: sync
          image: alpine/git:latest
          command: ["sh", "/conf/sync.sh"]
          env:
            - name: REPO_URL
              value: "http://<máy-gogs>:4001/minhnn23/cloud-tv.git"
            - name: BRANCH
              value: "main"
            - name: INTERVAL
              value: "60"
          volumeMounts:
            - name: site
              mountPath: /site
            - name: conf
              mountPath: /conf
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
        - name: web
          image: nginx:stable-alpine
          ports:
            - containerPort: 80
          readinessProbe:          # chỉ nhận truy cập khi repo đã kéo về xong
            httpGet:
              path: /tv/
              port: 80
            periodSeconds: 10
          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true
            - name: conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
      volumes:
        - name: site
          emptyDir: {}
        - name: conf
          configMap:
            name: cloud-tv-conf
---
apiVersion: v1
kind: Service
metadata:
  name: cloud-tv
spec:
  type: NodePort
  selector:
    app: cloud-tv
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
